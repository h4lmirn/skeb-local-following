<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skeb Local Following</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Skeb Local Following</h1>
      <p id="count">保存情報を確認中…</p>
      <label>
        <input id="blur" type="checkbox">
        一覧の作品例をぼかす
      </label>
      <fieldset id="amount-genres">
        <legend>表示するリクエスト種類</legend>
        <div id="amount-genre-options"></div>
        <p id="amount-genre-empty" class="note" hidden>保存済み情報にリクエスト種類がありません。</p>
      </fieldset>
      <fieldset>
        <legend>ローカルフォルダ</legend>
        <form id="folder-form">
          <input id="folder-name" type="text" maxlength="30" placeholder="例：依頼候補" required>
          <button type="submit">追加</button>
        </form>
        <div id="folder-list"></div>
        <p class="note">フォロー中ページの各カードで分類し、ページ上部から絞り込めます。</p>
      </fieldset>
      <fieldset>
        <legend>バックアップ・データ移行</legend>
        <div class="data-actions">
          <button id="export-data" type="button">バックアップを書き出す</button>
          <button id="import-data" type="button">バックアップを読み込む</button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
        <p class="note">別フォルダから新版を読み込む場合も、保存情報・フォルダ・表示設定を移行できます。</p>
      </fieldset>
      <p class="note">クリエイターページを開き、「この人を一覧用に保存」を押した場合だけ、その時点の公開情報がこの端末に保存されます。</p>
      <button id="clear" type="button">保存したクリエイター情報を削除</button>
      <p id="message" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
