<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skeb Local Following</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Skeb Local Following</h1>
      <p id="count">保存情報を確認中…</p>
      <label>
        <input id="blur" type="checkbox">
        一覧の作品例をぼかす
      </label>
      <p class="note">クリエイターページを開き、「この人を一覧用に保存」を押した場合だけ、その時点の公開情報がこの端末に保存されます。</p>
      <button id="clear" type="button">保存情報をすべて削除</button>
      <p id="message" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
